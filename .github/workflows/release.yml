name: Release

# Builds Save Grave and publishes a GitHub Release whenever a version tag is pushed, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the release and upload assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SaveGrave.slnx

      - name: Test
        run: dotnet test SaveGrave.slnx -c Release --no-restore

      - name: Publish (win-x64, self-contained single file)
        run: >
          dotnet publish SaveGrave.Desktop/SaveGrave.Desktop.csproj
          -c Release -r win-x64 --no-restore
          -o publish/win-x64

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zip = "SaveGrave-$version-win-x64.zip"
          # Drop loose debug symbols (Skia/HarfBuzz native pdbs) so the download stays lean.
          Remove-Item publish/win-x64/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/win-x64/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii
          "ARTIFACT=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
          draft: true
          generate_release_notes: true
          name: Save Grave ${{ github.ref_name }}
          body: |
            ## Save Grave ${{ github.ref_name }}

            Self-contained Windows build — no .NET install required. Download the `.zip`,
            extract it, and run `SaveGrave.exe`.

            **Note:** this build is not code-signed, so Windows SmartScreen may warn on first
            launch. Click **More info → Run anyway**. You can verify the download against the
            published `.sha256` checksum.
